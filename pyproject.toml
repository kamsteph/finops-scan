[project]
name = "finops-scan"
version = "0.1.4"
description = "Scan your AWS account for cloud waste in 60 seconds"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["finops", "aws", "cloud", "cost", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "boto3>=1.35.0",
    "click>=8.1.0",
    "rich>=13.0.0",      # terminal formatting — colored output, tables
]

[project.scripts]
finops-scan = "finops_scan.cli:main"

[project.urls]
Homepage    = "https://fync.io"
Repository  = "https://github.com/yourusername/finops-scan"
"Bug Tracker" = "https://github.com/yourusername/finops-scan/issues"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finops_scan"]

[tool.pytest.ini_options]
testpaths = ["tests"]